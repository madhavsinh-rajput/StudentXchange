<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#155e52">
    <title>My Profile — StudentXchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark">S</span>StudentXchange</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-2"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="browse.html">Browse Resources</a><a class="nav-link" href="sell.html">Sell Resource</a><span data-auth-nav class="navbar-nav flex-lg-row align-items-lg-center"><a class="nav-link" href="login.html">Login</a><a class="btn btn-primary btn-sm ms-lg-2" href="register.html">Register</a></span></div></div></div></nav>
    <header class="page-hero"><div class="container"><div class="eyebrow">Your account</div><h1 class="mt-2 mb-0">My profile</h1></div></header>
    <main class="section pt-4"><div class="container"><div id="profileContent"><div class="state-box"><div class="state-icon">…</div><h2 class="h5 text-dark">Loading your profile</h2><p class="mb-0">Getting your StudentXchange details.</p></div></div></div></main>
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content profile-modal"><form id="editProfileForm"><div class="modal-header"><div><div class="eyebrow">Your account</div><h2 class="modal-title h4 mt-1" id="editProfileTitle">Edit profile</h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><div id="profileEditAlert"></div><div class="mb-3"><label class="form-label" for="profileName">Name</label><input class="form-control" id="profileName" name="name" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="profileCollegeId">College ID</label><input class="form-control" id="profileCollegeId" name="collegeId" required></div><div class="row g-3"><div class="col-sm-7"><label class="form-label" for="profileDepartment">Department</label><input class="form-control" id="profileDepartment" name="department"></div><div class="col-sm-5"><label class="form-label" for="profileSemester">Semester</label><input class="form-control" id="profileSemester" name="semester"></div></div><div class="mt-3"><label class="form-label" for="profileBio">Bio</label><textarea class="form-control" id="profileBio" name="bio" maxlength="200" rows="3" placeholder="Tell your campus a little about yourself"></textarea><div class="form-text">Up to 200 characters.</div></div><div class="mt-3"><label class="form-label" for="profileImage">Profile image URL</label><input class="form-control" id="profileImage" name="profileImage" type="url" placeholder="https://"></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save changes</button></div></form></div></div></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an Account — StudentXchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="container"><a class="navbar-brand" href="index.html"><span
                    class="brand-mark">S</span>StudentXchange</a><a href="browse.html" class="nav-link">Browse resources
                →</a></div>
    </nav>
    <main class="auth-wrap">
        <div class="auth-card">
            <div id="authAlert"></div>
            <div class="eyebrow">Join your campus</div>
            <h1 class="h2 fw-bold mt-2">Create your account</h1>
            <p class="text-secondary mb-4">A few details and you’re ready to exchange.</p>
            <form id="registerForm">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control"
                            name="name" required maxlength="100" autocomplete="name"></div>
                    <div class="col-md-6"><label class="form-label">College ID</label><input class="form-control"
                            name="collegeId" required autocomplete="off"></div>
                    <div class="col-12"><label class="form-label">Email address</label><input class="form-control"
                            name="email" type="email" required autocomplete="email"></div>
                    <div class="col-md-6"><label class="form-label">Department</label><input class="form-control"
                            name="department" placeholder="e.g. Engineering"></div>
                    <div class="col-md-6"><label class="form-label">Semester</label><input class="form-control"
                            name="semester" placeholder="e.g. 3"></div>
                    <div class="col-md-6"><label class="form-label">Password</label><input class="form-control"
                            name="password" type="password" minlength="6" required autocomplete="new-password"></div>
                    <div class="col-md-6"><label class="form-label">Confirm password</label><input class="form-control"
                            name="confirmPassword" type="password" minlength="6" required autocomplete="new-password">
                    </div>
                    <div class="col-12"><button class="btn btn-primary btn-lg w-100" type="submit">Create
                            account</button></div>
                </div>
            </form>
            <p class="text-center text-secondary mt-4 mb-0">Already have an account? <a class="fw-bold"
                    style="color:var(--teal)" href="login.html">Log in</a></p>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>

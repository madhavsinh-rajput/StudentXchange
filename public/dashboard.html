rName" name="sellerName" required maxlength="100"></div><div class="col-md-6"><label class="form-label" for="editSellerEmail">Seller email *</label><input class="form-control" id="editSellerEmail" name="sellerEmail" type="email" required></div></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary" id="saveListingChanges">Save changes</button></div></form></div></div></div><footer class="footer"><div class="container"><div class="brand h4">StudentXchange</div><p>Buy. Sell. Exchange. Learn.</p><div class="small">© StudentXchange</div></div></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script></body></html>

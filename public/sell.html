<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sell a Resource — StudentXchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container"><a class="navbar-brand" href="index.html"><span
                    class="brand-mark">S</span>StudentXchange</a><button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2"><a class="nav-link"
                        href="index.html">Home</a><a class="nav-link" href="browse.html">Browse Resources</a><a
                        class="nav-link active" href="sell.html">Sell Resource</a><span data-auth-nav
                        class="navbar-nav flex-lg-row align-items-lg-center"><a class="nav-link"
                            href="login.html">Login</a><a class="btn btn-primary btn-sm ms-lg-2"
                            href="register.html">Register</a></span></div>
            </div>
        </div>
    </nav>
    <header class="page-hero">
        <div class="container">
            <div class="eyebrow">Pass it on</div>
            <h1 id="sellTitle" class="mt-2">List a resource</h1>
            <p class="text-secondary mb-0">Help another student find what they need.</p>
        </div>
    </header>
    <main class="section pt-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9 col-xl-8">
                    <div id="formAlert"></div>
                    <form id="resourceForm" class="form-card" novalidate>
                        <div class="row g-3">
                            <div class="col-12"><label class="form-label">Resource title *</label><input
                                    class="form-control" name="title" required maxlength="120"
                                    placeholder="e.g. Introduction to Algorithms, 4th edition"></div>
                            <div class="col-12"><label class="form-label">Description *</label><textarea
                                    class="form-control" name="description" rows="4" required maxlength="3000"
                                    placeholder="Share useful details about this resource…"></textarea></div>
                            <div class="col-md-6"><label class="form-label">Category *</label><select
                                    class="form-select" name="category" required></select></div>
                            <div class="col-md-6"><label class="form-label">Price (₹) *</label><input
                                    class="form-control" name="price" type="number" min="0" step="1" required
                                    placeholder="0"></div>
                            <div class="col-md-6"><label class="form-label">Condition *</label><select
                                    class="form-select" name="condition" required>
                                    <option value="">Choose condition</option>
                                    <option>New</option>
                                    <option>Like new</option>
                                    <option>Good</option>
                                    <option>Fair</option>
                                    <option>Used</option>
                                </select></div>
                            <div class="col-md-6"><label class="form-label">Department</label><input
                                    class="form-control" name="department" placeholder="e.g. Computer Science"></div>
                            <div class="col-md-6"><label class="form-label">Semester</label><input class="form-control"
                                    name="semester" placeholder="e.g. 3"></div>
                            <div class="col-md-6"><label class="form-label">Image URL</label><input class="form-control"
                                    name="image" type="url" placeholder="https://…"></div>
                            <div class="col-md-6"><label class="form-label">Seller name *</label><input
                                    class="form-control" name="sellerName" required maxlength="100"
                                    placeholder="Your name"></div>
                            <div class="col-md-6"><label class="form-label">Seller email *</label><input
                                    class="form-control" name="sellerEmail" type="email" required
                                    placeholder="you@college.edu"></div>
                            <div class="col-12 pt-2"><button id="submitResource" class="btn btn-primary btn-lg w-100"
                                    type="submit">Post resource</button></div>
                        </div>
                        <p class="small text-secondary mt-3 mb-0">Your email will be visible to students who want to
                            contact you.</p>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <div class="brand h4">StudentXchange</div>
            <p>Buy. Sell. Exchange. Learn.</p>
            <div class="small">© StudentXchange</div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
